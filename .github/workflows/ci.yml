name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # src/env.ts validates required server vars at import time; CI has no
  # database or secrets, so skip validation (honoured when NODE_ENV is not
  # production).
  SKIP_ENV_VALIDATION: "1"

jobs:
  checks:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # E2E (Playwright) is intentionally not wired up yet: e2e/first-chat.spec.ts
  # needs a database plus a running app, and there is no verified green
  # baseline. To enable later:
